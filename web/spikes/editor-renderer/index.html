<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cornfield editor renderer spike</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f1113;
        color: #f7f7f8;
        font:
          13px system-ui,
          sans-serif;
      }
      main {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      canvas {
        width: 1280px;
        height: 720px;
        max-width: 100vw;
        background: #181a1c;
      }
      output {
        position: fixed;
        inset: 12px auto auto 12px;
        white-space: pre-wrap;
      }
      #correctness {
        position: fixed;
        left: -9999px;
        width: 256px;
        height: 256px;
      }
      #v2-correctness {
        position: fixed;
        left: -9999px;
        width: 256px;
        height: 256px;
      }
      #raster-mask-correctness {
        position: fixed;
        left: -9999px;
        width: 256px;
        height: 64px;
      }
    </style>
  </head>
  <body>
    <main><canvas id="performance" width="1280" height="720"></canvas></main>
    <canvas id="correctness" width="256" height="256"></canvas>
    <canvas id="v2-correctness" width="256" height="256"></canvas>
    <canvas id="raster-mask-correctness" width="256" height="64"></canvas>
    <output>running</output>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
